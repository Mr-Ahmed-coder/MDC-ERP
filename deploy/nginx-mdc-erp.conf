# ==========================================================================
# Nginx reverse proxy for MDC Healthcare ERP  (HTTP -> HTTPS, TLS termination)
# Place at: /etc/nginx/sites-available/mdc-erp   then:
#   sudo ln -s /etc/nginx/sites-available/mdc-erp /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d erp.yourclinic.com     # free Let's Encrypt cert
#   sudo nginx -t && sudo systemctl reload nginx
# Replace erp.yourclinic.com with YOUR domain.
# ==========================================================================

# 1) Redirect all plain HTTP to HTTPS
server {
    listen 80;
    server_name erp.yourclinic.com;
    return 301 https://$host$request_uri;
}

# 2) HTTPS site — proxies to Gunicorn (the ERP) on localhost:8000
server {
    listen 443 ssl http2;
    server_name erp.yourclinic.com;

    # certbot fills in ssl_certificate / ssl_certificate_key automatically
    # ssl_certificate     /etc/letsencrypt/live/erp.yourclinic.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erp.yourclinic.com/privkey.pem;

    client_max_body_size 25M;          # allow scan/report uploads

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
