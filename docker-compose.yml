# Production stack: ERP + PostgreSQL
#   docker compose up -d --build
#   Serve through an HTTPS reverse proxy; do not expose Gunicorn directly to the Internet.
#   Required before startup: SECRET_KEY, JWT_SECRET_KEY, ENCRYPTION_KEY, and DB_PASSWORD.
services:
  erp:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DATABASE_URL=postgresql://mdc:${DB_PASSWORD}@db:5432/mdc_erp
      - FLASK_CONFIG=production
      - COOKIE_SECURE=1
      - SESSION_COOKIE_SECURE=1
      - PREFERRED_URL_SCHEME=https
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mdc
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=mdc_erp
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdc -d mdc_erp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg-data:
