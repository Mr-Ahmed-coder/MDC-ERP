# ============================================================================
# Render Infrastructure-as-Code (IaC) Blueprint
# ============================================================================
# Provisions a managed PostgreSQL 16 database and a Python web service running
# Gunicorn with zero manual UI clicks.
# ============================================================================

services:
  - type: web
    name: mdc-healthcare-erp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mdc-postgres
          property: connectionString
      - key: DB_PASSWORD
        fromDatabase:
          name: mdc-postgres
          property: password

databases:
  - name: mdc-postgres
    databaseName: mdc_erp
    user: mdc
    plan: starter
